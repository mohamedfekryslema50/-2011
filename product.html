<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a120e">
  <title>تفاصيل المنتج - MAIKA PRINT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="store-body" data-page="product-details">

  <header class="site-header">
    <a class="site-brand" href="store.html">
      <img class="brand-circle" src="logo.png" alt="" onerror="this.onerror=function(){this.style.display='none'};this.src='logo.jpg'">
      <span>MAIKA PRINT</span>
    </a>
  </header>

  <main class="product-details-container">
    <div id="productDetailsContent" class="product-details-grid">
      <p class="muted" style="text-align: center; grid-column: 1/-1;">جاري تحميل تفاصيل المنتج...</p>
    </div>
  </main>

  <!-- زر السلة العائم -->
  <button type="button" class="cart-fab" onclick="toggleCartModal()" aria-label="فتح السلة">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
    السلة
    <span id="cartCount" class="cart-count">0</span>
  </button>

  <!-- نافذة السلة -->
  <div id="cartModal" class="modal-overlay" onclick="if (event.target === this) toggleCartModal()">
    <div class="modal-box">
      <div class="modal-head">
        <h3>سلة المشتريات</h3>
        <button type="button" class="icon-close" onclick="toggleCartModal()">&times;</button>
      </div>
      <div id="cartItemsList"></div>
      <div class="promo-row">
        <input type="text" id="promoCodeInput" placeholder="كود الخصم" dir="ltr">
        <button type="button" class="ghost-btn" onclick="applyPromoCode()">تطبيق</button>
      </div>
      <div id="discountInfo" class="discount-info"></div>
      <div class="cart-total">
        <span>الإجمالي</span>
        <span><span id="cartTotalPrice">0.00</span> EGP</span>
      </div>
      <button type="button" class="action-btn full" onclick="sendCartToWhatsApp()">إتمام الطلب عبر واتساب</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="script.js"></script>
</body>
</html>
